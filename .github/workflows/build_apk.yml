name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'

    - name: Install Python Dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create .env file
      run: |
        echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
        echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> .env
        echo "YOUTUBE_CHANNEL_ID=${{ secrets.YOUTUBE_CHANNEL_ID }}" >> .env

    # --- PASSO 1: CONFIGURAR NOME E ÍCONE ---
    # Este comando cria a estrutura com o nome correto antes de compilar.
    # Usa 'default' no template para evitar o erro anterior.
    - name: Configure App Metadata
      run: |
        flet create . --template default --org "com.ieq.araraquara" --project-name "ieq_jd_portugal" --product-name "IEQ - Jd Portugal" --description "App de Gestão IEQ Araraquara"

    # --- PASSO 2: GERAR O APK ---
    # Agora o build apenas compila o que foi configurado acima.
    - name: Build APK
      run: |
        flet build apk --module-name app

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: IEQ-Araraquara-APK
        path: build/apk/*.apk